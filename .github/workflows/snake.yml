name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk@master
        with:
          github_user_name: laurajala
          outputs: |
            dist/snake.svg

      - name: Push changes
        uses: EndBug/add-and-commit@v9
        with:
          add: "dist/*.svg"
          message: "update snake"
